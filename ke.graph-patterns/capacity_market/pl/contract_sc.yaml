knowledge_engine:
  knowledge_base_id: 'https://capacity-market.pcss.pl/ke/smartconnector'
  kb_name: 'Capacity market'
  kb_description: 'Capacity market'
  graph_patterns:
    baseline:
      name: "baseline-flexibility"
      description: "Get flexibility for given baseline . POST/REACT"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"  
      pattern:
        - ' ?ts_uri rdf:type s4ener:TimeSeries ;  s4ener:producedBy  <http://fm.bluebird.com/> . '
        - ' ?dp s4ener:belongsToTimeSeries ?ts_uri ; rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;'
        - '  rdf:type  ubmarket:update_rate_15min ; saref:hasResult ?dpr.' 
        - ' ?dpr saref:hasValue ?value ; saref:isMeasuredIn om:megawatt .'
    flex-request:
      name: "flex-request"
      description: "Get flexibility for given baseline . POST/REACT"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"  
      pattern:
        - ' ?flex_request rdf:type s4ener:FlexRequest ; s4ener:producedBy  ?market_uri ; s4ener:includes  ?ts_uri .'
        - ' ?ts_uri rdf:type s4ener:TimeSeries  . '
        - ' ?dp s4ener:belongsToTimeSeries ?ts_uri ; rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;'
        - ' rdf:type  ubmarket:update_rate_60min ; saref:hasResult ?dpr.' 
        - ' ?dpr saref:hasValue ?value ; saref:isMeasuredIn om:megawatt .'     
    contract:
      name: "contract"
      description: "Exchange datapoints."
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - ' ?flex_offer rdf:type s4ener:FlexOffer; s4ener:producedBy ?flex_participant ; s4ener:FlexOffer ?flex_request . ' 
        - ' ?flex_request  s4ener:producedBy  ?market_uri .'
        - ' ?market_uri ubmarket:hasMarketType ubmarket:CapacityMarket ' 
        - ' ?flex_offer s4ener:includes ?flex_dp ; s4ener:includes ?cost_dp ;  '
        - ' ?flex_dp rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ; s4ener:hasEffectivePeriod ?duration ; saref:hasResult ?flex_dpr .' 
        - ' ?cost_dp rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ; s4ener:hasEffectivePeriod ?duration ; saref:hasResult ?cost_dpr .' 
        - ' ?flex_dpr saref:hasValue ?flex_value ; saref:isMeasuredIn om:megawatt .'
        - ' ?cost_dpr saref:hasValue ?cost_value ; saref:isMeasuredIn ubmarket:PLNPerKilowatt .'
    contract-ack:
      name: "contract-ack"
      description: "Exchange datapoints."
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - ' ?flex_offer rdf:type s4ener:FlexOffer ; s4ener:producedBy kb:service ; s4ener:FlexOffer ?flex_request . ' 
        - ' ?flex_request  s4ener:producedBy  ?market_uri .'
        - ' ?market_uri ubmarket:hasMarketType ubmarket:CapacityMarket ' 
        - ' ?flex_offer s4ener:includes ?flex_dp ; s4ener:includes ?cost_dp ;  '
        - ' ?flex_dp rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ; s4ener:hasEffectivePeriod ?duration ; saref:hasResult ?flex_dpr .' 
        - ' ?cost_dp rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ; s4ener:hasEffectivePeriod ?duration ; saref:hasResult ?cost_dpr .' 
        - ' ?flex_dpr saref:hasValue ?flex_value ; saref:isMeasuredIn om:megawatt .'
        - ' ?cost_dpr saref:hasValue ?cost_value ; saref:isMeasuredIn ubmarket:PLNPerKilowatt .'
     