knowledge_engine:
  knowledge_base_id: "https://capacity-market.pcss.pl/ke/smartconnector"
  kb_name: "Capacity market"
  kb_description: "Capacity market"
  prefixes:
    rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
    s4city: "https://saref.etsi.org/s4city/"
    s4ener: "https://saref.etsi.org/saref4ener/"
    foaf: "http://xmlns.com/foaf/0.1/"
    ubmarket: "https://ubflex.bluebird.eu/market/"
    rdfs: "http://www.w3.org/2000/01/rdf-schema#"
    saref: "https://saref.etsi.org/core/"
    time: "http://www.w3.org/2006/time#"
    xsd: "http://www.w3.org/2001/XMLSchema#"
 
  graph_patterns:
    flex-demand:
      name: "flex-demand"
      description: "Market details - POST"
      prefixes:  
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - "?asset_manager rdf:type foaf:Agent ."
        - " ?flex_instruction rdf:type s4ener:PPBCInstruction ; s4ener:hasExecutionTime ?ts ; s4ener:relatesToOffer ?flex_offer   . "
        - " ?flex_offer  s4ener:hasRecipient ?asset_manager ; s4ener:includes ?flex_profile . "
        - " ?flex_profile rdf:type s4ener:PowerLimitProfile  ; s4ener:receivesPowerLimit ?power_limit   ."
        - '  ?power_limit rdf:type s4ener:ContractualPowerLimit ;  s4ener:isObligatory "true"^^xsd:boolean; s4ener:hasPowerLimitDuration "PT60M"^^xsd:duration ; '
        - " s4ener:hasContractualConsumptionMax  ?max_consumption ."
        - "  ?max_consumption rdf:type saref:PropertyValue ; saref:hasValue ?max_consumption_value ; saref:isMeasuredIn om:megawatt ."
   