knowledge_engine:
  knowledge_base_id: "https://capacity-market.pcss.pl/ke/smartconnector"
  kb_name: "Capacity market"
  kb_description: "Capacity market"
  prefixes:
    rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
    s4mari: https://saref.etsi.org/s4mari/
    kb: "${KB_ID}/"
    saref: "https://saref.etsi.org/core/"
    xsd: "http://www.w3.org/2001/XMLSchema#" 
    s4city: "https://saref.etsi.org/s4city/"
    s4ener: "https://saref.etsi.org/saref4ener/"
    foaf: "http://xmlns.com/foaf/0.1/"
    ubmarket: "https://ubflex.bluebird.eu/market/"
    rdfs: "http://www.w3.org/2000/01/rdf-schema#" 
    time: "http://www.w3.org/2006/time#" 
  include:
    - "../../fm/flexibility_manager.yaml"
  graph_patterns:
    baseline-request:
      name: "baseline-request"
      description: "Get baseline requirement - minimum time span to calculate reference profile . POST/REACT"
      prefixes:
      required_bindings:
        - "ts_uri"
        - "ts_baseline_to"
        - "ts_baseline_from"
      pattern:
        - " ?baseline_ts_uri rdf:type s4ener:TimeSeries ; s4ener:producedBy  ?market ; s4ener:hasUsage s4ener:BaseLine ; "
        - " rdf:type  ubmarket:update_rate_60min ;  s4ener:hasEffectivePeriod  ?baseline_interval_uri ."
        - " ?ts_uri rdf:type s4ener:TimeSeries ; s4ener:producedBy  ?asset_manager ;  rdf:type  ubmarket:update_rate_60min ."
        - " ?baseline_interval_uri rdf:type time:Interval; time:hasBeginning ?ts_baseline_from; time:hasEnd ?ts_baseline_to ."
      result_pattern:
        - " ?ts_uri s4ener:hasEffectivePeriod  ?day_interval_uri . "
        - " ?day_interval_uri rdf:type time:Interval; time:hasBeginning ?ts_day_from; time:hasEnd ?ts_day_to ."
    baseline:
      name: "baseline"
      description: "Calc baseline . POST/REACT"
      prefixes:
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - " ?ts_uri rdf:type s4ener:TimeSeries ;  s4ener:producedBy  ?asset_manager. "
        - " ?dp s4ener:belongsToTimeSeries ?ts_uri ; rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;"
        - "  rdf:type  ubmarket:update_rate_60min ; saref:hasResult ?dpr."
        - " ?dpr saref:hasValue ?value ; saref:isMeasuredIn om:kilowatt ."
      result_pattern:
        - " ?dp_baseline s4ener:belongsToTimeSeries ?ts_uri ; rdf:type s4ener:DataPoint ;s4ener:hasUsage s4ener:BaseLine ;  "
        - "  saref:hasTimestamp ?ts ;  saref:hasResult ?dpr_baseline."
        - " ?dpr_baseline saref:hasValue ?value_baseline ; saref:isMeasuredIn om:kilowatt ."
    flex-request:
      name: "flex-request"
      description: " request for flexibility . POST/ASK"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - " ?flex_request rdf:type s4ener:FlexOffer ;  s4ener:producedBy ?market  ; s4ener:hasCreationTime  ?ts ; s4ener:hasEffectivePeriod ?offer_period."
        - " ?offer_period rdf:type time:Interval; time:hasBeginning ?ts_date_from; time:hasEnd ?ts_date_to . "
        - " ?market rdf:type ubmarket:Market ; ubmarket:hasMarketType ubmarket:CapacityMarket . "

    flex-offer:
      name: "flex-offer"
      description: " share flex offer . POST/ASK"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - " ?flex_request rdf:type s4ener:FlexOffer ;  s4ener:producedBy ?market ; s4ener:includes  ?dp ; "
        - " s4ener:includes ?flex_profile ; s4ener:hasRecipient ?asset_manager ."
        - " ?asset_manager rdf:type foaf:Agent . "
        - " ?flex_profile rdf:type s4ener:PowerLimitProfile ; saref:profileHasPrice ?profile_price . "
        - " ?profile_price saref:hasValue ?price ; saref:isMeasuredIn ubmarket:PLN . "
        - " ?dp   rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;"
        - " rdf:type  ubmarket:update_rate_60min ; saref:hasResult ?dpr."
        - " ?dpr saref:hasValue ?value ; saref:isMeasuredIn om:megawatt . "
    price-offer:
      name: "price-offer"
      description: " . ASK/POST"
      required_bindings:
        - "flex_request"
        - "flex_dp"
        - "flex_profile"
        - "ts"
        - "profile_price"
        - "flex_dpr"
        - "flex_value"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - " ?flex_request rdf:type s4ener:FlexOffer ; s4ener:producedBy ?market ; s4ener:includes  ?flex_dp ; "
        - "  s4ener:includes  ?price_dp ; s4ener:includes ?flex_profile ; s4ener:hasRecipient ?asset_manager ."
        - " ?asset_manager rdf:type foaf:Agent . "
        - " ?flex_profile rdf:type s4ener:PowerLimitProfile ; saref:profileHasPrice ?profile_price  . "
        - " ?profile_price saref:hasValue ?price ; saref:isMeasuredIn ubmarket:PLN . "
        - " ?flex_dp   rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;"
        - " rdf:type  ubmarket:update_rate_60min ; saref:hasResult ?flex_dpr."
        - " ?flex_dpr saref:hasValue ?flex_value ; saref:isMeasuredIn om:megawatt ."
        - " ?price_dp   rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;"
        - " rdf:type  ubmarket:update_rate_60min ; saref:hasResult ?price_dpr."
        - " ?price_dpr saref:hasValue ?price_value ; saref:isMeasuredIn  ubmarket:PLNPerKilowatt ."
    contract-ack:
      name: "contract-ack"
      description: " "
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern: 
        - " ?ack_execution  rdf:type saref:ProcedureExecution ; saref:targets ?contract ; saref:hasResult ?evt;  saref:hasResult ?flex_result; saref:hasResult ?price_result; saref:hasResultTime  ?ack_time ."
        - " ?flex_request rdf:type s4ener:FlexOffer; ubmarket:subjectTo ?contract ; s4ener:hasRecipient ?asset_manager ."
        - " ?contract rdf:type s4mari:Document   ."
        - " ?asset_manager rdf:type foaf:Agent ."
        - " ?evt rdf:type s4mari:Event ; saref:hasFeatureKind s4mari:Acknowledgement ; saref:hasState s4mari:IsCompleted ."
        - " ?flex_result rdf:type saref:PropertyValue ; saref:hasValue  ?accepted_flex ; saref:isMeasuredIn  om:megawatt. "
        - " ?price_result rdf:type saref:PropertyValue ; saref:hasValue  ?accepted_price ; saref:isMeasuredIn  ubmarket:PLNPerKilowatt ."
    contract:
      name: "contract"
      description: " "
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
        saref: "https://saref.etsi.org/core/"
        om: "http://www.ontology-of-units-of-measure.org/resource/om-2/"
      pattern:
        - " ?flex_request rdf:type s4ener:FlexOffer; s4ener:producedBy ?market ; ubmarket:subjectTo ?contract ; s4ener:hasRecipient ?asset_manager   . "
        - " ?contract rdf:type s4mari:Document ."
        - " ?market ubmarket:hasMarketType ubmarket:CapacityMarket ."
        - " ?asset_manager rdf:type foaf:Agent ."
        - " ?flex_request s4ener:includes ?flex_dp ; s4ener:includes ?price_dp . "
        - " ?flex_dp rdf:type s4ener:DataPoint ;   s4ener:hasEffectivePeriod ?period_uri ; saref:hasResult ?flex_dpr ."
        - " ?price_dp rdf:type s4ener:DataPoint ;  s4ener:hasEffectivePeriod ?period_uri ; saref:hasResult ?price_dpr ."
        - " ?flex_dpr saref:hasValue ?flex_value ; saref:isMeasuredIn om:megawatt ."
        - " ?price_dpr saref:hasValue ?price_value ; saref:isMeasuredIn ubmarket:PLNPerKilowatt ."
        - " ?period_uri  rdf:type time:Interval; time:hasBeginning ?ts_date_from; time:hasEnd ?ts_date_to . "

    capacity-market-price:
      name: "capacity-market-price"
      description: "Price information"
      prefixes:
        xsd: "http://www.w3.org/2001/XMLSchema#"
      pattern:
        - " ?market rdf:type ubmarket:Market ; ubmarket:hasMarketType ubmarket:CapacityMarket  ."
        - " ?offer_uri rdf:type ubmarket:MarketTimeSeries ."
        - " ?offer_uri s4ener:producedBy ?market ."
        - " ?dp s4ener:belongsToTimeSeries ?offer_uri ; rdf:type s4ener:DataPoint ; saref:hasTimestamp ?ts ;"
        - "   s4ener:hasEffectivePeriod ?duration_uri ; saref:hasResult ?dpr."
        - " ?duration_uri  rdf:type  time:Interval; time:hasXSDDuration ?duration ."
        - " ?dpr saref:hasValue ?value ; saref:isMeasuredIn ubmarket:PLNPerKilowatt  ."
